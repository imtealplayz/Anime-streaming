name: Build AnimeTeal Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build signed release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore private release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANIMETEAL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANIMETEAL_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" || -z "${KEYSTORE_PASSWORD}" ]]; then
            echo "::error::Missing ANIMETEAL_KEYSTORE_BASE64 or ANIMETEAL_KEYSTORE_PASSWORD repository secret."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/animeteal-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/animeteal-signing/animeteal-release.p12"
          chmod 600 "$RUNNER_TEMP/animeteal-signing/animeteal-release.p12"

          keytool -list \
            -keystore "$RUNNER_TEMP/animeteal-signing/animeteal-release.p12" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias animeteal >/dev/null

      - name: Build signed release APK
        working-directory: android
        env:
          ANIMETEAL_KEYSTORE_FILE: ${{ runner.temp }}/animeteal-signing/animeteal-release.p12
          ANIMETEAL_KEYSTORE_PASSWORD: ${{ secrets.ANIMETEAL_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Prepare release candidate
        run: cp android/app/build/outputs/apk/release/app-release.apk AnimeTeal-release-candidate.apk

      - name: Upload signed APK candidate
        uses: actions/upload-artifact@v4
        with:
          name: animeteal-signed-release-candidate
          path: AnimeTeal-release-candidate.apk
          if-no-files-found: error
          retention-days: 30
