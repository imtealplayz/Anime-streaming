name: Build and publish AnimeTeal Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the reviewed, release-signed APK to the official download link"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore private release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANIMETEAL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANIMETEAL_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" || -z "${KEYSTORE_PASSWORD}" ]]; then
            echo "::error::Missing ANIMETEAL_KEYSTORE_BASE64 or ANIMETEAL_KEYSTORE_PASSWORD repository secret."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/animeteal-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/animeteal-signing/animeteal-release.p12"
          chmod 600 "$RUNNER_TEMP/animeteal-signing/animeteal-release.p12"

          keytool -list \
            -keystore "$RUNNER_TEMP/animeteal-signing/animeteal-release.p12" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias animeteal >/dev/null

      - name: Build signed release APK
        working-directory: android
        env:
          ANIMETEAL_KEYSTORE_FILE: ${{ runner.temp }}/animeteal-signing/animeteal-release.p12
          ANIMETEAL_KEYSTORE_PASSWORD: ${{ secrets.ANIMETEAL_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature and certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature.txt"
          grep -Fq "Signer #1 certificate SHA-256 digest: 7f541a95597069081e3899da4068d19631cd4de17292e324a5fb145266f538be" "$RUNNER_TEMP/apk-signature.txt"

      - name: Prepare public APK
        run: cp android/app/build/outputs/apk/release/app-release.apk AnimeTeal.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: animeteal-android-release-apk
          path: AnimeTeal.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download
        if: ${{ (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[release]')) || inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: AnimeTeal Android (Latest)
          body: |
            AnimeTeal Android v2.2.6 (versionCode 10).

            Moves Continue Watching to Home with a first-launch relocation tip, improves the native video player with smoother controls and repeatable double-tap seeking, and adds a separate Watch Later list alongside Favorites.

            Download AnimeTeal.apk and install it on your Android device. This release uses AnimeTeal's permanent Android signing key, so existing installations with the same package and signing certificate can upgrade directly.
          target_commitish: main
          files: AnimeTeal.apk
          overwrite_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
