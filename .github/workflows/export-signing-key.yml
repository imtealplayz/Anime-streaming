name: Export AnimeTeal signing key securely

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/export-signing-key.yml"

permissions:
  actions: write
  contents: read

jobs:
  export-signing-key:
    name: Protect and export existing signing key
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore existing AnimeTeal signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: animeteal-debug-keystore-v2

      - name: Protect and verify the existing key
        shell: bash
        env:
          ANIMETEAL_KEYSTORE_PASSWORD: ${{ secrets.ANIMETEAL_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.android/debug.keystore"
          test -s "$KEYSTORE"
          test -n "$ANIMETEAL_KEYSTORE_PASSWORD"

          OUT_DIR="$GITHUB_WORKSPACE/animeteal-key-export"
          mkdir -p "$OUT_DIR"
          cp "$KEYSTORE" "$OUT_DIR/animeteal-release.jks"
          EXPORT_KEY="$OUT_DIR/animeteal-release.jks"

          # Re-protect the exact existing keypair; do not generate a new key.
          keytool -storepasswd \
            -keystore "$EXPORT_KEY" \
            -storepass android \
            -new "$ANIMETEAL_KEYSTORE_PASSWORD"

          keytool -keypasswd \
            -keystore "$EXPORT_KEY" \
            -storepass "$ANIMETEAL_KEYSTORE_PASSWORD" \
            -alias androiddebugkey \
            -keypass android \
            -new "$ANIMETEAL_KEYSTORE_PASSWORD"

          keytool -list -v \
            -keystore "$EXPORT_KEY" \
            -storepass "$ANIMETEAL_KEYSTORE_PASSWORD" \
            -alias androiddebugkey > "$RUNNER_TEMP/animeteal-cert.txt"

          FINGERPRINT="$(sed -n 's/^[[:space:]]*SHA256: //p' "$RUNNER_TEMP/animeteal-cert.txt" | head -n 1)"
          echo "Signing certificate SHA-256: $FINGERPRINT"
          echo "$FINGERPRINT" > "$OUT_DIR/signing-certificate-sha256.txt"

          if [[ "$FINGERPRINT" != "4D:A1:1D:29:EE:83:0E:B9:D4:BE:77:CD:06:2C:07:F5:16:56:9F:96:A7:ED:74:B3:5B:AE:72:D8:5C:95:52:2E" ]]; then
            echo "::error::The key's certificate does not match the fingerprint entered in Google Console. Do not use this key for releases until reconciled."
            exit 1
          fi

          echo "Existing registered certificate verified."
          sha256sum "$EXPORT_KEY" > "$OUT_DIR/animeteal-release.jks.sha256"

      - name: Upload encrypted keystore for owner transfer
        uses: actions/upload-artifact@v4
        with:
          name: animeteal-signing-key-encrypted
          path: |
            animeteal-key-export/animeteal-release.jks
            animeteal-key-export/animeteal-release.jks.sha256
            animeteal-key-export/signing-certificate-sha256.txt
          if-no-files-found: error
          retention-days: 1
