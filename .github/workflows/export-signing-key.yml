name: Diagnose AnimeTeal APK signing identity

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/export-signing-key.yml"

permissions:
  contents: read

jobs:
  diagnose-signing:
    name: Locate the actual Android debug signing key
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore the cached keystore
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: animeteal-debug-keystore-v2
      - name: Print Android signing paths and cached keystore
        shell: bash
        run: |
          set -euo pipefail
          echo "HOME=$HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_USER_HOME=${ANDROID_USER_HOME:-<unset>}"
          echo "ANDROID_SDK_HOME=${ANDROID_SDK_HOME:-<unset>}"
          java -XshowSettings:properties -version 2>&1 | grep "user.home" || true
          echo "Contents of $HOME/.android:"
          ls -la "$HOME/.android" || true
          echo "All keystore-like files:"
          find "$HOME" "$ANDROID_HOME" "$GITHUB_WORKSPACE/android" -type f \\
            \\( -iname "*.keystore" -o -iname "*.jks" \\) -print 2>/dev/null || true
          echo "Cached keystore certificate (if present):"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey || true
      - name: Ask Gradle for its actual variant signing configuration
        working-directory: android
        run: gradle --no-daemon :app:signingReport
